<!DOCTYPE html>
<html lang="id">
<head>
  <!--
    This bundle is served from the domain root on Vercel and from the
    /LagiButuh-web/ project sub-path on GitHub Pages. Relative URLs resolve
    against the document URL on both, so no <base href> is pinned here: a
    pinned base can only ever be right for one of the two hosts.
  -->
  <script>
    /* The canonical host is https://lagibutuh.thedev.id (Vercel). The legacy
       GitHub Pages project site at
       https://grey21onyx.github.io/LagiButuh-web/ probes it and forwards
       visitors there, keeping path, query and hash so deep links survive.
       While the thedev.id record does not exist yet the probe fails and the
       Pages copy keeps serving the app instead of sending people to a host
       that does not answer. */
    (function () {
      if (!/(^|\.)github\.io$/i.test(location.hostname)) return;
      var origin = "https://lagibutuh.thedev.id";
      var path = location.pathname.replace(new RegExp("^/LagiButuh-web/?"), "");
      fetch(origin + "/version.json", { mode: "no-cors", cache: "no-store" })
        .then(function () {
          location.replace(origin + "/" + path + location.search + location.hash);
        })
        .catch(function () {});
    })();
  </script>
  <link rel="canonical" href="https://lagibutuh.thedev.id/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <title>LagiButuh — Platform Layanan Lokal untuk Kebutuhanmu</title>
  <meta name="description" content="LagiButuh menghubungkan pelanggan dengan penyedia layanan lokal di Batam — laundry dan depot air — dengan pemesanan, penjemputan, pelacakan real-time, dan konfirmasi antar dalam satu aplikasi.">
  <meta name="application-name" content="LagiButuh">
  <meta name="theme-color" content="#1B60D5">
  <meta name="theme-color" content="#11358B" media="(prefers-color-scheme: dark)">

  <!-- Link previews -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="LagiButuh">
  <meta property="og:title" content="LagiButuh — Platform Layanan Lokal untuk Kebutuhanmu">
  <meta property="og:description" content="Pesan laundry dan depot air dari penyedia lokal di Batam, lacak penjemputan dan antar secara real-time.">
  <meta property="og:locale" content="id_ID">

  <!-- iOS home-screen app -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LagiButuh">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <!-- Icons and PWA manifest -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png">
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background-color: #96DE21;
    }

    /* Boot splash. The engine is multi-megabyte, so the tab would otherwise be
       a blank green rectangle until Flutter's first frame. It sits under the
       engine canvas (same stacking context, earlier in the document) and is
       removed by flutter_bootstrap.js once the app has started. */
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #11358B;
      text-align: center;
      transition: opacity 240ms ease-out;
    }
    #boot.boot-done {
      opacity: 0;
    }
    #boot img {
      width: 84px;
      height: 84px;
      border-radius: 22px;
      box-shadow: 0 10px 30px rgba(17, 53, 139, 0.18);
    }
    #boot p {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
    }
    #boot .boot-bar {
      width: 132px;
      height: 4px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(17, 53, 139, 0.16);
    }
    #boot .boot-bar i {
      display: block;
      width: 45%;
      height: 100%;
      border-radius: inherit;
      background: #11358B;
      animation: boot-slide 1.15s ease-in-out infinite;
    }
    @keyframes boot-slide {
      from { transform: translateX(-110%); }
      to { transform: translateX(240%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #boot .boot-bar i { animation: none; width: 100%; }
    }
  </style>

  <!-- Vercel Web Analytics and Speed Insights are first-party endpoints served
       by Vercel itself, so they measure the deployed site without a third
       party. On any other host both paths 404 and cost nothing. -->
  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>
  <noscript>
    <p style="font-family: system-ui, sans-serif; padding: 24px; color: #11358B;">
      LagiButuh membutuhkan JavaScript. Aktifkan JavaScript di peramban Anda,
      lalu muat ulang halaman ini.
    </p>
  </noscript>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <div id="boot" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="LagiButuh">
    <p>Menyiapkan LagiButuh…</p>
    <span class="boot-bar"><i></i></span>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
