<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Halaman tidak ditemukan — LagiButuh</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1B60D5">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">

  <script>
    /* Same contract as index.html: the legacy GitHub Pages project site
       forwards to the canonical host once it answers. Unknown URLs under the
       Pages project reach this document, so the path is kept. */
    (function () {
      if (!/(^|\.)github\.io$/i.test(location.hostname)) return;
      /* Same auth-callback guard as index.html: a `?code=` exchange needs the
         PKCE verifier stored on the origin that started it. */
      if (/[?&](code|error)=/.test(location.search) ||
          /(access_token|refresh_token|error)=/.test(location.hash)) return;
      var origin = "https://lagibutuh.vercel.app";
      var path = location.pathname.replace(new RegExp("^/LagiButuh-web/?"), "");
      fetch(origin + "/version.json", { mode: "no-cors", cache: "no-store" })
        .then(function () {
          location.replace(origin + "/" + path + location.search + location.hash);
        })
        .catch(function () {});
    })();
  </script>

  <style>
    html, body { height: 100%; margin: 0; background-color: #96DE21; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #11358B;
      text-align: center;
      padding: 24px;
    }
    img { width: 84px; height: 84px; border-radius: 22px; box-shadow: 0 10px 30px rgba(17, 53, 139, 0.18); }
    h1 { margin: 0; font-size: 20px; }
    p { margin: 0; font-size: 15px; max-width: 32rem; line-height: 1.5; }
    a {
      display: inline-block;
      margin-top: 6px;
      padding: 10px 18px;
      border-radius: 999px;
      background: #11358B;
      color: #ffffff;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <img src="icons/Icon-192.png" alt="LagiButuh">
  <h1>Halaman tidak ditemukan</h1>
  <p>Tautan ini tidak ada di LagiButuh. Kembali ke halaman utama untuk memesan laundry atau depot air.</p>
  <a href="/">Buka LagiButuh</a>
</body>
</html>
